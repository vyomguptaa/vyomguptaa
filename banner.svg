<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d0221"/>
      <stop offset="55%" stop-color="#1d0b3e"/>
      <stop offset="100%" stop-color="#3b0f5e"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd319"/>
      <stop offset="45%" stop-color="#ff901f"/>
      <stop offset="100%" stop-color="#ff2975"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8ef9ff"/>
      <stop offset="48%" stop-color="#e6fdff"/>
      <stop offset="52%" stop-color="#ff71ce"/>
      <stop offset="100%" stop-color="#ff2ecc"/>
    </linearGradient>
    <linearGradient id="gridfade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff2ecc" stop-opacity="0"/>
      <stop offset="25%" stop-color="#ff2ecc" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ff2ecc" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="sunclip">
      <rect x="880" y="60" width="260" height="230"/>
    </clipPath>
  </defs>

  <!-- sky -->
  <rect width="1200" height="420" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#ffffff">
    <circle cx="90" cy="60" r="1.6"><animate attributeName="opacity" values="1;0.2;1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="220" cy="120" r="1.2"><animate attributeName="opacity" values="0.3;1;0.3" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="340" cy="50" r="1.4"><animate attributeName="opacity" values="1;0.3;1" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="470" cy="90" r="1.1"><animate attributeName="opacity" values="0.4;1;0.4" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="610" cy="45" r="1.5"><animate attributeName="opacity" values="1;0.2;1" dur="4.2s" repeatCount="indefinite"/></circle>
    <circle cx="730" cy="110" r="1.2"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="180" r="1.1"><animate attributeName="opacity" values="0.5;1;0.5" dur="3.7s" repeatCount="indefinite"/></circle>
    <circle cx="820" cy="40" r="1.3"><animate attributeName="opacity" values="1;0.3;1" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="1050" cy="35" r="1.4"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="1160" cy="90" r="1.2"><animate attributeName="opacity" values="1;0.2;1" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="950" cy="55" r="1.1"><animate attributeName="opacity" values="0.3;1;0.3" dur="4.4s" repeatCount="indefinite"/></circle>
    <circle cx="60" cy="240" r="1.2"><animate attributeName="opacity" values="0.5;1;0.5" dur="3.3s" repeatCount="indefinite"/></circle>
  </g>

  <!-- retro sun with stripe cuts -->
  <g clip-path="url(#sunclip)">
    <circle cx="1010" cy="200" r="120" fill="url(#sun)" filter="url(#glow)"/>
    <g fill="#0d0221">
      <rect x="870" y="196" width="280" height="7"/>
      <rect x="870" y="216" width="280" height="9"/>
      <rect x="870" y="238" width="280" height="11"/>
      <rect x="870" y="263" width="280" height="13"/>
    </g>
  </g>

  <!-- perspective grid -->
  <g stroke="url(#gridfade)" stroke-width="1.5">
    <line x1="600" y1="290" x2="600" y2="420"/>
    <line x1="600" y1="290" x2="450" y2="420"/>
    <line x1="600" y1="290" x2="300" y2="420"/>
    <line x1="600" y1="290" x2="120" y2="420"/>
    <line x1="600" y1="290" x2="-120" y2="420"/>
    <line x1="600" y1="290" x2="-450" y2="420"/>
    <line x1="600" y1="290" x2="750" y2="420"/>
    <line x1="600" y1="290" x2="900" y2="420"/>
    <line x1="600" y1="290" x2="1080" y2="420"/>
    <line x1="600" y1="290" x2="1320" y2="420"/>
    <line x1="600" y1="290" x2="1650" y2="420"/>
  </g>
  <g stroke="#ff2ecc" stroke-width="1.5" filter="url(#softglow)">
    <line x1="0" y1="290" x2="1200" y2="290" opacity="0.9"/>
    <line x1="0" y1="302" x2="1200" y2="302" opacity="0.4"/>
    <line x1="0" y1="318" x2="1200" y2="318" opacity="0.5"/>
    <line x1="0" y1="340" x2="1200" y2="340" opacity="0.6"/>
    <line x1="0" y1="370" x2="1200" y2="370" opacity="0.7"/>
    <line x1="0" y1="408" x2="1200" y2="408" opacity="0.8"/>
  </g>

  <!-- name -->
  <g font-family="Arial Black, Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="600" y="165" font-size="76" font-weight="900" font-style="italic" letter-spacing="6"
          fill="url(#chrome)" filter="url(#softglow)" stroke="#12002e" stroke-width="1.5" paint-order="stroke">ANDRII DROK</text>
    <text x="600" y="215" font-size="21" letter-spacing="10" font-family="Courier New, monospace" font-weight="bold" fill="#8ef9ff" filter="url(#softglow)">CS STUDENT &#183; BUILDER &#183; SF BAY AREA</text>
  </g>
</svg>
